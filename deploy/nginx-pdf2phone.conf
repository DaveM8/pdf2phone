# /etc/nginx/sites-available/pdf2phone  — replace read.example.com with your subdomain.
# Then:  sudo ln -s /etc/nginx/sites-available/pdf2phone /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#        sudo certbot --nginx -d read.example.com      (adds HTTPS + redirect)

server {
    listen 80;
    listen [::]:80;
    server_name read.example.com;

    # Keep in step with PDF2PHONE_MAX_MB in .env.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
