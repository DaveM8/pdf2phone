services:
  pdf2phone:
    build: .
    image: pdf2phone:latest
    container_name: pdf2phone
    restart: unless-stopped
    env_file: .env
    # Only reachable from the server itself; nginx forwards the public site to it.
    ports:
      - "127.0.0.1:${PDF2PHONE_PORT:-8090}:8000"
    volumes:
      - library:/data/library
    # About 4 GB per conversion that can run at once (PDF2PHONE_WORKERS, default 3),
    # plus room for the web app.  Set PDF2PHONE_MEM_LIMIT in .env to change it.
    mem_limit: ${PDF2PHONE_MEM_LIMIT:-14g}

volumes:
  library:
